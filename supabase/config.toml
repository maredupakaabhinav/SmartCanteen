# Minimal Supabase CLI config. Used for `supabase link` and `supabase db push`.
project_id = "smart-canteen"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "https://smart-canteen-blond.vercel.app"
additional_redirect_urls = [
  "https://smart-canteen-blond.vercel.app/sign-in",
  "https://smart-canteen-blond.vercel.app/reset-password",
  "http://localhost:5173/sign-in",
  "http://localhost:5173/reset-password",
]

[auth.email]
enable_signup = true
enable_confirmations = true

[realtime]
enabled = true

[storage]
file_size_limit = "2MiB"
