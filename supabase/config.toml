# Minimal Supabase CLI config. Used for `supabase link` and `supabase db push`.
project_id = "smart-canteen"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "http://localhost:5173/sign-in"]

[auth.email]
enable_signup = true
enable_confirmations = true

[realtime]
enabled = true

[storage]
file_size_limit = "2MiB"
